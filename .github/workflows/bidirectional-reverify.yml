name: Bidirectional transfer regression
on:
  push:
    paths:
      - '.github/workflows/bidirectional-reverify.yml'
permissions:
  contents: write
jobs:
  verify-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/bidirectional_fix.py
      - run: npm ci
      - run: npm test
      - run: timeout 120s node tests/browser-integration.mjs
      - name: Commit verified bidirectional fix
        run: |
          git config user.name "chatgpt-bidirectional-fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js src/room.js tests/browser-integration.mjs tests/room.test.mjs
          git diff --cached --check
          git commit -m "Make connected peers bidirectional for file transfer"
          git push
