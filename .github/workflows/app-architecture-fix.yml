name: Finalize app architecture fix

on:
  push:
    paths:
      - '.github/workflows/app-architecture-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh deployed cache version
        run: python3 scripts/cache_bump.py
      - name: Commit cache refresh
        run: |
          git config user.name "chatgpt-app-fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --check
          git commit -m "Refresh app cache after transfer architecture fix"
          git push
