name: Apply app architecture fix

on:
  push:
    paths:
      - '.github/workflows/app-architecture-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: python3 scripts/app_architecture_fix.py
      - name: Commit source fix
        run: |
          git config user.name "chatgpt-app-fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js
          git diff --cached --check
          git commit -m "Fix transfer acceptance lifecycle and storage policy"
          git push
