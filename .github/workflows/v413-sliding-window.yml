name: v4.13 Sliding-window validation

on:
  push:
    branches:
      - perf/sliding-window-v413

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/sliding-window-v413
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply performance patch
        run: python3 scripts/patch-v413.py
      - name: Install dependencies
        run: npm ci
      - name: Run transfer protocol tests
        run: timeout 60s node --test tests/block-transfer.test.mjs
      - name: Run full test suite
        run: timeout 90s npm test
      - name: Build production bundle
        run: npm run build
      - name: Syntax check generated bundle
        run: node --check assets/app.js
      - name: Commit validated release candidate
        run: |
          rm -f scripts/patch-v413.py .github/workflows/v413-sliding-window.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pipeline verified blocks with packed storage; v4.13.0"
          git push origin HEAD:perf/sliding-window-v413
