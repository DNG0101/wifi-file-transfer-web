name: Build v4.11 disconnect and turbo transfer patch

on:
  push:
    branches:
      - fix/per-user-disconnect-turbo-transfer

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply source patch and final cleanup
        run: |
          if grep -q '"version": "4.10.0"' package.json; then
            python scripts/patch-v411.py
          fi
          python - <<'PY'
          from pathlib import Path

          app = Path('src/app.js')
          text = app.read_text(encoding='utf-8')
          old = "if(roomMember)disconnected=room.disconnect(roomMember.id)||disconnected;\n if(trust?.rooms?.has(id))"
          new = "if(roomMember){disconnected=room.disconnect(roomMember.id)||disconnected;members=members.filter(m=>m.deviceId!==id);}\n if(trust?.rooms?.has(id))"
          if old in text:
              text = text.replace(old, new, 1)
              app.write_text(text, encoding='utf-8')
          elif "members=members.filter(m=>m.deviceId!==id)" not in text:
              raise SystemExit('Room disconnect cleanup target was not found')

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          if '# Wi-Fi File Transfer — version 4.10.0' in readme_text:
              readme.write_text(readme_text.replace('# Wi-Fi File Transfer — version 4.10.0','# Wi-Fi File Transfer — version 4.11.0',1),encoding='utf-8')
          PY

      - name: Install pinned dependencies
        run: npm ci

      - name: Run logic regression suite
        run: npm test

      - name: Build shipped browser bundle
        run: npm run build

      - name: Syntax-check shipped bundle
        run: node --check assets/app.js

      - name: Record validation
        run: |
          cat > docs/validation-4.11.md <<'EOF'
          # Version 4.11.0 validation

          Automated validation ran on GitHub Actions after applying the per-device disconnect and transfer-throughput patch.

          ## Changes validated

          - Explicit disconnect revokes the selected online device on both endpoints without forgetting it permanently.
          - QR/room and remembered-device paths are removed from the local connected-device list immediately when that device is disconnected.
          - Active transfers to a deliberately disconnected device retain verified progress and stop automatic reconnect attempts until the user resumes.
          - WebRTC file frames use the negotiated SCTP message size up to a 1 MiB safety cap instead of a fixed 64 KiB cap.
          - Data-channel backpressure uses an adaptive 8–32 MiB send window instead of the previous 1 MiB window.
          - The next 8 MiB source block is prefetched while the current block is hashed/transferred.
          - SHA-256 block verification, final whole-file verification, pause/resume, cancellation, and verified-block reconnect semantics remain enabled.
          - No new runtime dependency was added.

          ## Automated checks

          - `npm test` passed.
          - `npm run build` passed.
          - `node --check assets/app.js` passed.
          - Added deterministic tests for explicit disconnect, adaptive transport sizing, deeper backpressure, and reduced frame count when SCTP supports larger messages.

          Actual throughput remains bounded by Wi-Fi link quality, browser WebRTC/SCTP implementation, CPU, and storage speed; the optimization removes application-side under-filling but does not promise a fixed speed multiplier on every device.
          EOF

      - name: Commit generated source and bundle when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Finalize per-device disconnect and turbo transfer; v4.11.0"
            git push origin HEAD:fix/per-user-disconnect-turbo-transfer
          fi
